name: Regression and release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest==9.1.1
      - run: python scripts/release_version.py --check
      - name: JavaScript syntax
        run: |
          node --check main.js
          node --check sw.js
          find js scripts -name '*.js' -exec node --check {} \;
      - run: python -m pytest -q
      - run: node scripts/evaluate_balance.js --assert
      - run: python scripts/public_experience_check.py
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Chromium UI checks
        env:
          AIBS_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
        run: python scripts/ui_experience_check.py
